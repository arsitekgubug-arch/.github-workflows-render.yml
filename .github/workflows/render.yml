name: Render Remotion Shorts Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    name: Render Video MP4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ''

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Render Remotion Video
        run: |
          mkdir -p out
          npx remotion render src/index.ts BuildingCollapseShorts out/video-shorts.mp4 --gl=angle

      - name: Upload Video Hasil Render
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video-shorts
          path: out/video-shorts.mp4
          retention-days: 7
